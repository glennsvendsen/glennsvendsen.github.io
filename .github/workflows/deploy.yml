name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Two jobs (GitHub's recommended layout): the deploy job starts only after the artifact upload has
# fully finished, so deploy-pages can always find it. In one job it sometimes looked too early.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Publish only the site: not the Worker source, generators, scans or notes.
      - name: Collect site files
        run: |
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude 'worker' --exclude 'assets-src' --exclude '*.md' --exclude '.DS_Store'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
